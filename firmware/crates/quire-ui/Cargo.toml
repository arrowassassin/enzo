[package]
name = "quire-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quire's screen system: key grammar, screen stack, widgets, the Spine, and every screen of the reader"
build = "build.rs"

[dependencies]
quire-fs = { path = "../quire-fs" }
quire-gfx = { path = "../quire-gfx", default-features = false }
quire-fonts = { path = "../quire-fonts" }
quire-layout = { path = "../quire-layout" }
quire-qtx = { path = "../quire-qtx" }
quire-doc = { path = "../quire-doc" }
quire-library = { path = "../quire-library" }
serde = { workspace = true }
postcard = { workspace = true }
qrcodegen-no-heap = { workspace = true }
miniz_oxide = { workspace = true }

[features]
default = ["builtin-dict"]
# Compile WordNet (data/en.qdict, ~1.5 MB) into the binary as the first "Define" source.
builtin-dict = []
std = ["quire-fs/std", "quire-library/std", "quire-doc/std", "quire-gfx/std"]

[dev-dependencies]
quire-fs = { path = "../quire-fs", features = ["std"] }
quire-gfx = { path = "../quire-gfx", features = ["std"] }
quire-library = { path = "../quire-library", features = ["std"] }
quire-doc = { path = "../quire-doc", features = ["std"] }
# The .qdict writer, for the built-in dictionary's round-trip tests.
quire-dict = { path = "../../tools/quire-dict" }
