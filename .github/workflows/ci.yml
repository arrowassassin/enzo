name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  host:
    name: host crates (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: firmware }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: heap budget and snapshot report
        run: cargo run -p quire-sim -- --report target/sim-report.md
      - uses: actions/upload-artifact@v4
        with: { name: sim-report, path: firmware/target/sim-report.md, if-no-files-found: ignore }

  device:
    name: firmware (ESP32-C3)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware/device } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: riscv32imc-unknown-none-elf, components: "rust-src, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: firmware/device }
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked espflash@4.6.0
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - name: app image (for OTA and the SD update path)
        run: |
          mkdir -p ../../dist
          espflash save-image --chip esp32c3 --flash-size 16mb --partition-table partitions.csv --target-app-partition ota_0 \
            target/riscv32imc-unknown-none-elf/release/quire-x3 ../../dist/quire-x3.bin
          if [ -f target/riscv32imc-unknown-none-elf/release/quire-recovery ]; then
            espflash save-image --chip esp32c3 --flash-size 16mb --partition-table partitions.csv --target-app-partition recovery \
              target/riscv32imc-unknown-none-elf/release/quire-recovery ../../dist/quire-recovery.bin
          fi
      - name: assets image (the dictionary, flashed at the assets partition)
        run: |
          cp ../crates/quire-ui/data/en.qdict ../../dist/quire-assets.bin
      - name: factory image (bootloader + table + app + assets, flash at 0x0)
        run: |
          espflash save-image --chip esp32c3 --merge --partition-table partitions.csv --target-app-partition ota_0 \
            --flash-size 16mb target/riscv32imc-unknown-none-elf/release/quire-x3 ../../dist/quire-x3-factory.bin
          # espflash merges only the app; the assets partition is appended at its table offset.
          assets_off=$(grep '^assets,' partitions.csv | cut -d, -f4 | tr -d ' ')
          dd if=../../dist/quire-assets.bin of=../../dist/quire-x3-factory.bin bs=4096 seek=$((assets_off / 4096)) conv=notrunc status=none
          ls -la ../../dist
      - uses: actions/upload-artifact@v4
        with: { name: quire-x3-images, path: dist/*.bin }

  release:
    name: publish release images
    needs: [host, device]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: quire-x3-images, path: dist }
      - name: checksums
        run: cd dist && sha256sum *.bin > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/SHA256SUMS
          generate_release_notes: true
